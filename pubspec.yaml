name: lifescope
description: Handle app lifecycle events per feature in Flutter. Independent listeners, ordered async callbacks, iOS background time and desktop exit guards.
version: 0.1.1
repository: https://github.com/ebrahimmansur/lifescope
issue_tracker: https://github.com/ebrahimmansur/lifescope/issues
topics:
  - lifecycle
  - app-lifecycle
  - desktop
  - ios
  - android

platforms:
  android:
  ios:
  linux:
  macos:
  web:
  windows:

environment:
  sdk: ^3.4.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      ios:
        pluginClass: LifeScopePlugin
